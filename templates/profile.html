<!DOCTYPE html>
<html>
<head>
<title>Customer Profile</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(to right,#141e30,#243b55);
    color:white;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    background:black;
    padding:15px 30px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.menu a{
    color:white;
    margin-left:20px;
    text-decoration:none;
    font-weight:bold;
}

/* PROFILE CARD */
.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:80vh;
}

.card{
    background:white;
    color:black;
    padding:30px;
    width:350px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.4);
}

.card img{
    width:100px;
    height:100px;
    border-radius:50%;
    margin-bottom:15px;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 20px;
    background:orange;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">ਪਿੰਡ ਵਾਲਾ ਮਾਰਕੀਟ</div>

    <div class="menu">
        <a href="/">Home</a>
        <a href="/cart">Cart</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="card">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

        <h2>Welcome, {{username}} 👋</h2>

        <p>Your account is active.</p>
        <p>Role: Customer</p>

        <a href="/dashboard" class="btn">View Orders</a>

    </div>
</div>

</body>
</html>
