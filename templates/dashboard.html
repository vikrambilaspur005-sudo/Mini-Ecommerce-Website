<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(to right,#141e30,#243b55);
    color:white;
}

.navbar{
    background:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
}

.navbar a{
    text-decoration:none;
    margin-left:15px;
    color:black;
    font-weight:bold;
}

.container{
    text-align:center;
    padding:30px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    width:220px;
    background:white;
    color:black;
    border-radius:15px;
    padding:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="navbar">
    <div><b>📦 My Dashboard</b></div>

    <div>
        <a href="/">Home</a>
        <a href="/cart">Cart</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">

<h1>Your Orders</h1>

<div class="cards">
{% for o in orders %}
<div class="card">
    <img src="/static/images/{{o[3]}}">
    <h3>{{o[1]}}</h3>
    <p>₹{{o[2]}}</p>
    <p style="color:green;">✔ Delivered</p>
</div>
{% endfor %}
</div>

</div>

</body>
</html>
