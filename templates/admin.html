<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(to right,#667eea,#764ba2);
}

/* NAVBAR */
.navbar{
    background:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.menu a{
    text-decoration:none;
    margin-left:15px;
    color:black;
    font-weight:bold;
}

/* MAIN */
.container{
    padding:30px;
    text-align:center;
}

h1{
    color:white;
}

/* FORM */
.form-box{
    background:white;
    width:450px;
    margin:auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.form-box input,
.form-box select{
    width:90%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

.form-box button{
    width:95%;
    padding:12px;
    background:#fb641b;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.form-box button:hover{
    background:#e65c00;
}

/* PRODUCTS */
.products{
    margin-top:40px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    width:240px;
    background:white;
    border-radius:12px;
    padding:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
}

.category{
    background:#e3f2fd;
    color:#1565c0;
    padding:5px 10px;
    border-radius:15px;
    display:inline-block;
    margin:5px 0;
    font-size:14px;
}

.delete-btn{
    display:inline-block;
    margin-top:10px;
    padding:8px 12px;
    background:red;
    color:white;
    text-decoration:none;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">🛠 Admin Panel</div>

    <div class="menu">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/profile">Profile</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">

<h1>Add New Product</h1>

<div class="form-box">

<form action="/add_product" method="POST" enctype="multipart/form-data">

    <input type="text"
           name="name"
           placeholder="Product Name"
           required>

    <input type="number"
           name="price"
           placeholder="Product Price"
           required>

    <!-- CATEGORY -->
    <select name="category" required>
        <option value="">Select Category</option>
        <option value="Fashion">Fashion</option>
        <option value="Electronics">Electronics</option>
        <option value="Shoes">Shoes</option>
        <option value="Daily Use">Daily Use</option>
    </select>

    <input type="file"
           name="image"
           required>

    <button type="submit">
        Add Product
    </button>

</form>

</div>

<h1>All Products</h1>

<div class="products">

{% for p in products %}

<div class="card">

    <img src="/static/images/{{p[3]}}">

    <h3>{{p[1]}}</h3>

    <p>₹{{p[2]}}</p>

    {% if p|length > 4 %}
    <div class="category">
        {{p[4]}}
    </div>
    {% endif %}

    <br>

    <a href="/delete_product/{{p[0]}}" class="delete-btn">
        Delete
    </a>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
